<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="50%" stop-color="#090f1a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Cyan Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f5a0" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes rotate-radar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-ring {
      0% { r: 30px; opacity: 0.9; }
      100% { r: 120px; opacity: 0; }
    }
    @keyframes scanline {
      0% { y: 0; opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { y: 320; opacity: 0.2; }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes text-glow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.4)); }
      50% { filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.85)); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }

    .radar-rotator {
      transform-origin: 850px 160px;
      animation: rotate-radar 6s linear infinite;
    }
    .pulse-circle {
      transform-origin: 850px 160px;
      animation: pulse-ring 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .laser-line {
      animation: scanline 4s ease-in-out infinite alternate;
    }
    .floating-box-1 {
      animation: float-badge 3s ease-in-out infinite;
    }
    .floating-box-2 {
      animation: float-badge 3.6s ease-in-out infinite 0.8s;
    }
    .banner-title {
      font-family: 'Orbitron', 'Inter', -apple-system, sans-serif;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 3px;
      fill: url(#cyan-grad);
      animation: text-glow 4s ease-in-out infinite;
    }
    .banner-subtitle {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 2.5px;
      fill: #ffffff;
    }
    .banner-desc {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      fill: #8b9bb4;
    }
    .grid-lines {
      stroke: #00f2fe;
      stroke-opacity: 0.07;
      stroke-width: 1;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="16" fill="url(#bg-grad)" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Cyber Grid Pattern -->
  <g class="grid-lines">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="280" x2="1000" y2="280" />

    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
  </g>

  <!-- Laser Scanline Animation -->
  <line class="laser-line" x1="0" y1="0" x2="1000" y2="0" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.8" filter="url(#glow-cyan)" />

  <!-- RADAR SCANNER ANIMATION (Right Section) -->
  <g id="radar-assembly">
    <!-- Concentric Target Circles -->
    <circle cx="850" cy="160" r="110" fill="none" stroke="#00f2fe" stroke-opacity="0.15" stroke-width="1.5" />
    <circle cx="850" cy="160" r="80" fill="none" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1" />
    <circle cx="850" cy="160" r="50" fill="none" stroke="#00f2fe" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="850" cy="160" r="20" fill="none" stroke="#00f5a0" stroke-opacity="0.5" stroke-width="1.5" />

    <!-- Pulse Wave -->
    <circle class="pulse-circle" cx="850" cy="160" r="30" fill="none" stroke="#00f5a0" stroke-width="2" />

    <!-- Radar Crosshairs -->
    <line x1="730" y1="160" x2="970" y2="160" stroke="#00f2fe" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="850" y1="40" x2="850" y2="280" stroke="#00f2fe" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Rotating Radar Sweeper -->
    <g class="radar-rotator">
      <path d="M 850 160 L 960 160 A 110 110 0 0 0 927 82 Z" fill="url(#radar-glow)" />
      <line x1="850" y1="160" x2="960" y2="160" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cyan)" />
    </g>

    <!-- Radar Blips -->
    <circle cx="890" cy="120" r="4" fill="#00f5a0" filter="url(#glow-cyan)" />
    <circle cx="810" cy="190" r="3.5" fill="#4facfe" filter="url(#glow-cyan)" />
    <circle cx="860" cy="225" r="3" fill="#9d4edd" />

    <!-- Center Node Icon -->
    <circle cx="850" cy="160" r="6" fill="#00f2fe" filter="url(#glow-strong)" />
  </g>

  <!-- LEFT HERO TYPOGRAPHY & BADGES -->
  <!-- Top Badge -->
  <g class="floating-box-1" transform="translate(60, 42)">
    <rect width="250" height="30" rx="6" fill="#00f2fe" fill-opacity="0.08" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#00f5a0" filter="url(#glow-cyan)" />
    <text x="30" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00f2fe" letter-spacing="1.5">DEFENSE IN DEPTH // ACTIVE</text>
  </g>

  <!-- Main Name -->
  <text x="60" y="125" class="banner-title">TANUJ CHANDRA</text>

  <!-- Title & Experience -->
  <text x="62" y="158" class="banner-subtitle">SENIOR DEVSECOPS ENGINEER &amp; CLOUD SECURITY ARCHITECT</text>
  <text x="62" y="185" class="banner-desc">12+ Years Enterprise Resilience • Zero-Trust Cloud • K8s Hardening • SLSA Level 3</text>

  <!-- Metric Badges Row -->
  <g class="floating-box-2" transform="translate(60, 220)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="135" height="52" rx="8" fill="#0b1220" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
    <text x="16" y="25" font-family="'Orbitron', sans-serif" font-size="18" font-weight="900" fill="#00f2fe">12+ YRS</text>
    <text x="16" y="42" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#8b9bb4">ENTERPRISE EXP</text>

    <!-- Badge 2 -->
    <rect x="150" y="0" width="135" height="52" rx="8" fill="#0b1220" stroke="#00f5a0" stroke-opacity="0.3" stroke-width="1" />
    <text x="166" y="25" font-family="'Orbitron', sans-serif" font-size="18" font-weight="900" fill="#00f5a0">500+</text>
    <text x="166" y="42" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#8b9bb4">MICROSERVICES</text>

    <!-- Badge 3 -->
    <rect x="300" y="0" width="135" height="52" rx="8" fill="#0b1220" stroke="#4facfe" stroke-opacity="0.3" stroke-width="1" />
    <text x="316" y="25" font-family="'Orbitron', sans-serif" font-size="18" font-weight="900" fill="#4facfe">99.99%</text>
    <text x="316" y="42" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#8b9bb4">UPTIME SLA</text>

    <!-- Badge 4 -->
    <rect x="450" y="0" width="145" height="52" rx="8" fill="#0b1220" stroke="#9d4edd" stroke-opacity="0.3" stroke-width="1" />
    <text x="466" y="25" font-family="'Orbitron', sans-serif" font-size="18" font-weight="900" fill="#00f5a0">ZERO</text>
    <text x="466" y="42" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#8b9bb4">SUPPLY BREACHES</text>
  </g>

  <!-- Corner Brackets Decorative -->
  <path d="M 12 28 L 12 12 L 28 12" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M 988 28 L 988 12 L 972 12" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M 12 292 L 12 308 L 28 308" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M 988 292 L 988 308 L 972 308" stroke="#00f2fe" stroke-width="2" fill="none" />
</svg>
