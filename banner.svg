<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <!-- Refined Accent Gradient -->
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radar-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes rotate-radar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-wave {
      0% { r: 25px; opacity: 0.8; }
      100% { r: 130px; opacity: 0; }
    }
    @keyframes scan-beam {
      0% { y: 0; opacity: 0.15; }
      50% { opacity: 0.7; }
      100% { y: 360; opacity: 0.15; }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .radar-beam {
      transform-origin: 1010px 180px;
      animation: rotate-radar 7s linear infinite;
    }
    .pulse-ring {
      transform-origin: 1010px 180px;
      animation: pulse-wave 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .laser-beam {
      animation: scan-beam 5s ease-in-out infinite alternate;
    }
    .float-item-1 {
      animation: float-badge 4s ease-in-out infinite;
    }
    .float-item-2 {
      animation: float-badge 4.5s ease-in-out infinite 0.6s;
    }
    
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .font-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
    .font-body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .font-mono {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
  </g>

  <!-- Laser Scanline Animation -->
  <line class="laser-beam" x1="0" y1="0" x2="1200" y2="0" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.6" filter="url(#subtle-glow)" />

  <!-- TOP STATUS BADGE -->
  <g class="float-item-1" transform="translate(70, 42)">
    <rect width="280" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="16" r="4.5" fill="#34d399" filter="url(#subtle-glow)" />
    <text x="32" y="21" class="font-mono" fill="#34d399">ZERO-TRUST ARCHITECTURE // 12+ YRS</text>
  </g>

  <!-- HEADER TYPOGRAPHY -->
  <text x="70" y="128" class="font-title">Tanuj Chandra</text>
  <text x="72" y="160" class="font-subtitle">PRINCIPAL DEVSECOPS ARCHITECT &amp; CLOUD SECURITY LEAD</text>
  <text x="72" y="190" class="font-body">Securing Enterprise Cloud Workloads • Multi-Tenant K8s Defense • Automated Policy-as-Code • SLSA Level 3 Supply Chain</text>

  <!-- METRIC KPI CARDS ROW -->
  <g class="float-item-2" transform="translate(70, 235)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="165" height="66" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="32" class="font-title" font-size="24" fill="#00e5ff">12+ Years</text>
    <text x="18" y="52" class="font-body" font-size="11" fill="#64748b">ENTERPRISE PRACTICE</text>

    <!-- KPI 2 -->
    <rect x="180" y="0" width="165" height="66" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="198" y="32" class="font-title" font-size="24" fill="#34d399">500+ Nodes</text>
    <text x="198" y="52" class="font-body" font-size="11" fill="#64748b">HARDENED CLUSTERS</text>

    <!-- KPI 3 -->
    <rect x="360" y="0" width="165" height="66" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="378" y="32" class="font-title" font-size="24" fill="#38bdf8">99.99%</text>
    <text x="378" y="52" class="font-body" font-size="11" fill="#64748b">ZERO-DRIFT SLA</text>

    <!-- KPI 4 -->
    <rect x="540" y="0" width="175" height="66" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="558" y="32" class="font-title" font-size="24" fill="#a78bfa">SLSA L3+</text>
    <text x="558" y="52" class="font-body" font-size="11" fill="#64748b">PROVENANCE ASSURED</text>
  </g>

  <!-- ELEGANT RADAR & DEFENSE VISUALIZATION (Right Side) -->
  <g id="radar-assembly">
    <!-- Outer Decorative Rings -->
    <circle cx="1010" cy="180" r="125" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="1010" cy="180" r="90" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="1010" cy="180" r="55" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" />
    <circle cx="1010" cy="180" r="24" fill="none" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Pulse Wave Animation -->
    <circle class="pulse-ring" cx="1010" cy="180" r="30" fill="none" stroke="#34d399" stroke-width="1.5" />

    <!-- Radar Crosshairs -->
    <line x1="880" y1="180" x2="1140" y2="180" stroke="#1e293b" stroke-width="1" />
    <line x1="1010" y1="50" x2="1010" y2="310" stroke="#1e293b" stroke-width="1" />

    <!-- Rotating Radar Sweeper -->
    <g class="radar-beam">
      <path d="M 1010 180 L 1135 180 A 125 125 0 0 0 1098 92 Z" fill="url(#radar-gradient)" />
      <line x1="1010" y1="180" x2="1135" y2="180" stroke="#00e5ff" stroke-width="1.5" filter="url(#subtle-glow)" />
    </g>

    <!-- Satellite Security Nodes -->
    <circle cx="1055" cy="130" r="4" fill="#34d399" filter="url(#subtle-glow)" />
    <circle cx="965" cy="225" r="3.5" fill="#38bdf8" filter="url(#subtle-glow)" />
    <circle cx="1025" cy="255" r="3" fill="#a78bfa" />

    <!-- Central Node -->
    <circle cx="1010" cy="180" r="6" fill="#00e5ff" filter="url(#subtle-glow)" />
  </g>

  <!-- Architectural Corner Trim Elements -->
  <path d="M 16 32 L 16 16 L 32 16" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
  <path d="M 1184 32 L 1184 16 L 1168 16" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
  <path d="M 16 328 L 16 344 L 32 344" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
  <path d="M 1184 328 L 1184 344 L 1168 344" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
</svg>
